# ============================================================
# Compression policy  (~/compress/work/lib/compress.conf)
#
# Edit the values below to change movie / series / audio limits
# without touching the scripts. The file is read (bash syntax) by
# work/lib/policy.sh and validated whenever a menu starts; invalid
# values stop the menu with a message naming the setting.
#
# Units:  sizes in GiB, video bitrates in Mb/s, audio bitrates in kb/s,
#         sample lengths in seconds, CRF as x265 CRF (0-51).
# Numbers may be decimals ("2.5") unless noted. No negative values.
#
# Always applied, not configurable here:
#   - a video bitrate is never raised above the source video bitrate
#   - a CRF encode estimated at or above the source video size is not
#     started without asking (keep the source video, encode anyway, skip)
#   - movie and series compression copy every audio track unchanged
#     (codec, bitrate, channels, Atmos / DTS:X, titles, flags); audio
#     compression is only done by audio_compress_menu.sh (AUDIO_* below)
# ============================================================


# ============================================================
# MOVIE VIDEO POLICY  (work/movie_compress.sh; audio is copied)
#
# Quality  two-pass bitrate encode sized from the runtime (below).
# High     x265 CRF encode, CRF chosen per title (see CRF TIERS).
# Base     x265 CRF encode, CRF chosen per title (see CRF TIERS).
# Custom   x265 CRF encode at exactly the CRF entered in the menu.
#
# Quality settings:
# *_VIDEO_GIB_PER_HOUR / *_VIDEO_*_GIB
#                 size of the main video stream only. Audio,
#                 subtitles, attachments and container overhead
#                 are not included. Never more than the source video.
# *_FLOOR_MBPS    minimum video bitrate; if the size target gives
#                 less, the menu asks: floor bitrate or size target
#                 (not asked when the source itself limits the target)
# *_MAX_MBPS      video bitrate ceiling; 0 = no bitrate ceiling,
#                 the size decides
# ============================================================

# ---- Quality: video size from runtime, with a minimum size.
#   rate target  = runtime hours * MOVIE_QUALITY_VIDEO_GIB_PER_HOUR
#   video target = max(rate target, MOVIE_QUALITY_VIDEO_MIN_GIB),
#                  never more than the source video size
# The bitrate follows from that size and the runtime, capped at
# MOVIE_QUALITY_VIDEO_MAX_MBPS (0 = no cap). MIN_GIB is a minimum for
# short movies, not a maximum. If the result is below the floor, the
# menu asks: floor bitrate or size target.
MOVIE_QUALITY_VIDEO_GIB_PER_HOUR=8.4
MOVIE_QUALITY_VIDEO_MIN_GIB=20
MOVIE_QUALITY_VIDEO_FLOOR_MBPS=12
MOVIE_QUALITY_VIDEO_MAX_MBPS=0

# ============================================================
# CRF TIERS  (movie High / Base, series High / Base)
#
# Constant quality instead of a size target. Lower CRF = higher
# quality, so:
#   *_CRF_MIN   the tier's preferred (highest-quality) CRF; every title
#               starts here and never goes below it, even when the
#               size ceiling would leave room
#   *_CRF_MAX   the lowest quality the tier allows; never exceeded
#               automatically
#   *_VIDEO_SIZE_CEILING_GIB
#               VIDEO stream only (per movie / per episode). The CRF is
#               raised one step at a time from CRF_MIN only while the
#               estimated video size is above this. Copied audio,
#               subtitles and container overhead are not counted.
#
# The estimate comes from short sample encodes of the actual source
# (same scaling, HDR signalling, bit depth and x265 settings as the
# final encode), taken at several points of the title. When even
# CRF_MAX is estimated above the ceiling, the menu warns and asks.
# The ceiling is a selection goal, not a post-encode byte guarantee.
#
# CRF values: whole numbers 0-51 (x265 range).
# ============================================================

# ---- Movie High
MOVIE_HIGH_CRF_MIN=19
MOVIE_HIGH_CRF_MAX=23
MOVIE_HIGH_VIDEO_SIZE_CEILING_GIB=7

# ---- Movie Base
MOVIE_BASE_CRF_MIN=25
MOVIE_BASE_CRF_MAX=29
MOVIE_BASE_VIDEO_SIZE_CEILING_GIB=2

# ---- Series High / Base: ONE CRF for the whole batch (season/folder).
# CRFs are tried from CRF_MIN up; the first one whose MEDIAN episode
# video estimate fits the per-episode ceiling is used for every episode.
# The ceiling is NOMINAL: episodes estimated above it are listed as
# outliers but keep the season CRF (consistent quality matters more
# than every episode meeting the ceiling); one difficult episode does
# not push the whole season to a higher CRF.
#   High: typical 40-60 min episode ~2.5-4 GiB video at CRF 18
#   Base: typical 40-60 min episode ~0.6-1.1 GiB video at CRF 24
SERIES_HIGH_CRF_MIN=18
SERIES_HIGH_CRF_MAX=21
SERIES_HIGH_VIDEO_SIZE_CEILING_GIB=5

SERIES_BASE_CRF_MIN=24
SERIES_BASE_CRF_MAX=27
SERIES_BASE_VIDEO_SIZE_CEILING_GIB=1.5

# ---- Post-encode CRF check (movie / series High and Base)
# After encoding, the ACTUAL video size (audio not counted) is checked
# against the tier's video ceiling: above it, the encode is repeated at
# CRF + 1 (up to the tier's CRF_MAX). When it fits with plenty of room
# to spare (the sample estimate was too pessimistic), CRF - 1 is tried:
# only when the actual video is at least this many percent below the
# ceiling (e.g. 20: 5 GiB ceiling -> at most 4 GiB) ...
CRF_DOWN_RETRY_HEADROOM_PCT=20
# ... never below the tier's CRF_MIN, and at most this many lower-CRF
# attempts per title / season (0 = never try a lower CRF). A lower
# attempt above the ceiling is discarded; the fitting encode is kept.
CRF_DOWN_RETRY_MAX=2

# Added to expected series total sizes for container / subtitles /
# metadata (%). Movies use the actual non-audio/video bytes of the source.
SERIES_CONTAINER_RESERVE_PCT=1

# ---- CRF size estimation (sample encodes)
# Length of each sample section (seconds). Every tested CRF re-encodes
# the same sections. Titles shorter than about 2x the total sample
# length are sampled whole (exact, no extrapolation).
CRF_SAMPLE_SECONDS=20
# Movie: sections spread from 10% to 90% of the runtime (skips opening
# logos and end credits), e.g. 5 -> 10/30/50/70/90 %.
MOVIE_CRF_SAMPLE_POINTS=5
# Series: episodes sampled (spread over the batch) and sections per
# sampled episode. Episodes that are not sampled get the median
# sampled bitrate for their estimate.
SERIES_CRF_SAMPLE_EPISODES=4
SERIES_CRF_SAMPLE_POINTS=3


# ============================================================
# AUDIO COMPRESSION POLICY  (audio_compress_menu.sh only)
#
# The only place audio is re-encoded. Movie / series compression never
# reads these settings.
# ============================================================

# High: offered only for tracks above this bitrate (kb/s).
AUDIO_HIGH_TRIGGER_KBPS=2000

# Compact: offered only for tracks of at least this size (GiB) ...
AUDIO_COMPACT_TRIGGER_GIB=1.0
# ... and the result is kept below this size (GiB).
AUDIO_COMPACT_LIMIT_GIB=0.95

# High target rates (kb/s), codec family of the source kept where possible.
AUDIO_HIGH_KBPS_1=128                 # mono
AUDIO_HIGH_KBPS_2=320                 # stereo
AUDIO_HIGH_KBPS_3TO4=640
AUDIO_HIGH_KBPS_5TO6=1024             # 5.1 (AC-3 is limited to 640 by the format)
AUDIO_HIGH_KBPS_7PLUS=1280

# Compact target rates (kb/s, Opus).
AUDIO_COMPACT_KBPS_1=96
AUDIO_COMPACT_KBPS_2=192
AUDIO_COMPACT_KBPS_3TO4=384
AUDIO_COMPACT_KBPS_5TO6=640
AUDIO_COMPACT_KBPS_7PLUS=768
