# ============================================================
# Compression policy  (~/compress/work/lib/compress.conf)
#
# Edit the values below to change movie / series / audio limits
# without touching the scripts. The file is read (bash syntax) by
# work/lib/policy.sh and validated whenever a menu starts; invalid
# values stop the menu with a message naming the setting.
#
# Units:  sizes in GiB, video bitrates in Mb/s, audio bitrates in kb/s,
#         sample lengths in seconds, CRF as x265 CRF (0-51).
# Numbers may be decimals ("2.5") unless noted. No negative values.
#
# Always applied, not configurable here:
#   - a CRF encode estimated at or above the source video size is not
#     started without asking (keep the source video, encode anyway, skip)
#   - movie and series compression copy every audio track unchanged
#     (codec, bitrate, channels, Atmos / DTS:X, titles, flags); audio
#     compression is only done by audio_compress_menu.sh (AUDIO_* below)
# ============================================================


# ============================================================
# MOVIE VIDEO POLICY  (work/movie_compress.sh; audio is copied)
#
# Quality  x265 CRF encode, CRF chosen per title for a video size band (below).
# High     x265 CRF encode, CRF chosen per title (see CRF TIERS).
# Base     x265 CRF encode, CRF chosen per title (see CRF TIERS).
# Custom   x265 CRF encode at exactly the CRF entered in the menu.
# ============================================================

# ---- Quality: x265 CRF encode aimed at a VIDEO size band.
# All sizes are the main video stream only: copied audio, subtitles,
# attachments and container overhead are not included (and never
# influence the CRF choice).
# CRFs are estimated with the same sample encodes as High / Base (see
# CRF TIERS below), starting at MOVIE_QUALITY_CRF_START:
#   - start estimate above ACCEPT_MAX: CRF + 1, + 2, ... until an
#     estimate is at or below ACCEPT_MAX (or CRF_MAX is reached);
#   - start estimate at or below ACCEPT_MAX (inside the band or below
#     it): CRF - 1, - 2, ... until an estimate is above ACCEPT_MAX (or
#     CRF_MIN is reached), so the lowest CRF still inside the band is
#     found even when CRF_START itself is already inside it.
# From the CRFs estimated:
#   1. the LOWEST CRF (highest quality) whose estimate is inside
#      ACCEPT_MIN..ACCEPT_MAX is chosen; a CRF inside the band is never
#      raised just to get closer to the target;
#   2. when no CRF is inside the band, the CRF whose estimate is closest
#      to TARGET is chosen (equal distance: the lower CRF).
# A CRF estimated at or above the source video size is never chosen;
# a source video at or below TARGET asks first (keep the source video,
# encode anyway below the source size, or skip).
# After the encode the ACTUAL video size is checked: above ACCEPT_MAX
# -> CRF + 1 (up to CRF_MAX); below ACCEPT_MIN -> CRF - 1 (down to
# CRF_MIN, never limited by CRF_START; at most CRF_DOWN_RETRY_MAX times;
# a lower CRF above ACCEPT_MAX is discarded and the previous encode
# kept). Inside the band nothing is re-encoded.
# Required: 0 < ACCEPT_MIN <= TARGET <= ACCEPT_MAX (GiB).
MOVIE_QUALITY_TARGET_VIDEO_GIB=20
MOVIE_QUALITY_ACCEPT_MIN_GIB=18
MOVIE_QUALITY_ACCEPT_MAX_GIB=22

# Quality CRF search bounds (whole numbers 0-51, MIN <= START <= MAX).
# START is only the first CRF sampled, for efficiency: Quality may search
# below START or above START as needed. It is not a minimum.
# MIN / MAX are the absolute lowest / highest CRF Quality may use (in the
# search and in the post-encode retry).
MOVIE_QUALITY_CRF_MIN=0
MOVIE_QUALITY_CRF_START=8
MOVIE_QUALITY_CRF_MAX=23

# ============================================================
# CRF TIERS  (movie High / Base, series High / Base)
#
# Constant quality instead of a size target. Lower CRF = higher
# quality, so:
#   *_CRF_START       the first CRF sampled; not a bound. The search
#                     goes up from it while the estimate is above the
#                     ceiling, or down from it while the estimate fits
#   *_CRF_SEARCH_MIN  the lowest (highest-quality) CRF the search may
#                     choose, and the floor of the post-encode lower-CRF
#                     retry. Keep it close to START (default: START - 2)
#                     so a small title does not walk to a near-lossless
#                     CRF; = START: never below START
#   *_CRF_MAX         the lowest quality the tier allows; never exceeded
#                     automatically
#   *_VIDEO_SIZE_CEILING_GIB
#               VIDEO stream only (per movie / per episode). Copied
#               audio, subtitles and container overhead are not counted.
# The CRF chosen is the adjacent boundary around the ceiling:
#     CRF N      estimated above the ceiling
#     CRF N + 1  fits                          ->  CRF N + 1
# i.e. the lowest CRF of SEARCH_MIN..MAX that fits. START above the
# ceiling: CRF + 1 / + 2 upward (see CRF_ADAPTIVE_STEP_THRESHOLD_PCT);
# START fits: CRF - 1, - 2, ... (one at a time) until a CRF is above the
# ceiling, or SEARCH_MIN is reached and still fits (SEARCH_MIN chosen).
# Required: SEARCH_MIN <= START <= MAX. A config with the former
# *_CRF_MIN only (start and floor in one) still works: it is used as
# START and SEARCH_MIN (nothing below it is searched), with a note.
#
# The estimate comes from short sample encodes of the actual source
# (same scaling, HDR signalling, bit depth and x265 settings as the
# final encode), taken at several points of the title. When even
# CRF_MAX is estimated above the ceiling, the menu warns and asks.
# After the encode the ACTUAL video size is checked against the ceiling
# as well (post-encode CRF check below): above it, the encode is repeated
# at a higher CRF. Only at CRF_MAX can a result stay above the ceiling
# (warned and flagged at the end of the job).
#
# CRF values: whole numbers 0-51 (x265 range).
# ============================================================

# ---- Movie High
MOVIE_HIGH_CRF_SEARCH_MIN=10
MOVIE_HIGH_CRF_START=12
MOVIE_HIGH_CRF_MAX=23
MOVIE_HIGH_VIDEO_SIZE_CEILING_GIB=7

# ---- Movie Base
MOVIE_BASE_CRF_SEARCH_MIN=18
MOVIE_BASE_CRF_START=20
MOVIE_BASE_CRF_MAX=29
MOVIE_BASE_VIDEO_SIZE_CEILING_GIB=1.5

# ---- Series High / Base: one SEASON CRF for the batch (season/folder);
# only an isolated outlier episode may get its own, higher CRF.
# CRFs are tried from CRF_START, up or down as above. At each CRF every
# episode's video is estimated, and an episode estimated above the
# median episode by more than SERIES_CRF_OUTLIER_PCT is an outlier
# (needs 3+ episodes):
#   - exactly one outlier: it is ISOLATED. The season CRF is the lowest
#     CRF at which every OTHER episode fits the per-episode ceiling; the
#     outlier then gets the lowest CRF from the season CRF up at which
#     its own estimate fits (one difficult episode does not lower the
#     quality of the whole season)
#   - two or more outliers: they are part of the season's difficulty,
#     not outliers; the season CRF rises until every episode fits
# Before the encode, regular episodes never get different CRFs just
# because their estimates vary. After the encode, the post-encode CRF
# check below may move a single episode one or more steps up (actual
# video above the ceiling) or one step down (plenty of room left).
# The ceiling is a per-episode VIDEO limit (copied audio, subtitles and
# container not counted). Never above CRF_MAX: an episode estimated above
# the ceiling even at CRF_MAX is warned about and asked for.
#   High: typical 40-60 min episode ~2.5-4 GiB video at CRF 18
#   Base: typical 40-60 min episode ~0.6-1.1 GiB video at CRF 24
SERIES_HIGH_CRF_SEARCH_MIN=8
SERIES_HIGH_CRF_START=15
SERIES_HIGH_CRF_MAX=21
SERIES_HIGH_VIDEO_SIZE_CEILING_GIB=5

SERIES_BASE_CRF_SEARCH_MIN=11
SERIES_BASE_CRF_START=18
SERIES_BASE_CRF_MAX=27
SERIES_BASE_VIDEO_SIZE_CEILING_GIB=1.5

# Outlier threshold (%): an episode estimated more than this above the
# median episode at the same CRF is an outlier (25: > median x 1.25).
SERIES_CRF_OUTLIER_PCT=25

# ---- Post-encode CRF check (movie / series High and Base)
# After encoding, the ACTUAL video size (audio not counted) is checked
# against the tier's video ceiling: above it, the encode is repeated at
# CRF + 1 (up to the tier's CRF_MAX). Series episodes are checked and
# retried ONE BY ONE (never the whole season). When it fits with plenty
# of room to spare (the sample estimate was too pessimistic), CRF - 1 is
# tried: only when the actual video is at least this many percent below
# the ceiling (e.g. 20: 5 GiB ceiling -> at most 4 GiB) ...
CRF_DOWN_RETRY_HEADROOM_PCT=20
# ... and CRF - 1 is predicted to stay at least this many percent below
# the ceiling (actual size x the sampled CRF - 1 / CRF estimate ratio;
# 5: at most 95 % of the ceiling), so a lower CRF that would most likely
# be discarded is not encoded at all (movie Quality: not used) ...
CRF_DOWN_RETRY_FIT_MARGIN_PCT=5
# A lower CRF is never below the tier's CRF_SEARCH_MIN (not CRF_START: a
# CRF chosen below START keeps that room; a series outlier: never below
# the season CRF) and never a CRF already found above the ceiling.
# A lower attempt above the ceiling is discarded; the fitting encode is
# kept. Lower-CRF attempts at most (0 = never try a lower CRF):
#   CRF_DOWN_RETRY_MAX         per movie (movie High / Base / Quality)
#   SERIES_CRF_DOWN_RETRY_MAX  per episode (series High / Base)
CRF_DOWN_RETRY_MAX=2
SERIES_CRF_DOWN_RETRY_MAX=1

# Added to expected series total sizes for container / subtitles /
# metadata (%). Movies use the actual non-audio/video bytes of the source.
SERIES_CONTAINER_RESERVE_PCT=1

# ---- CRF size estimation (sample encodes)
# Length of each sample section (seconds). Every tested CRF re-encodes
# the same sections. Titles shorter than about 2x the total sample
# length are sampled whole (exact, no extrapolation).
CRF_SAMPLE_SECONDS=20
# Movie: sections spread from 10% to 90% of the runtime (skips opening
# logos and end credits), e.g. 5 -> 10/30/50/70/90 %.
MOVIE_CRF_SAMPLE_POINTS=5
# Series: episodes sampled (spread over the batch, plus the longest
# episode) and sections per sampled episode. Episodes that are not
# sampled are estimated conservatively: the HIGHEST sampled bitrate x
# their runtime (a single sampled episode far above the others is left
# out of that, as it is an isolated outlier). Such an inferred estimate
# never makes a season CRF too large on its own: when an episode that was
# not sampled decides (largest regular episode above the ceiling, or an
# outlier that keeps a sampled one from being isolated) and the samples
# alone do not already prove the CRF too large, that episode is sampled
# itself at that CRF first ("sampled after inference") and the season
# figures are recomputed. An isolated outlier is always sampled itself
# before it gets its own CRF; anything the samples miss is caught by the
# post-encode check of each episode.
SERIES_CRF_SAMPLE_EPISODES=4
SERIES_CRF_SAMPLE_POINTS=3
# Adaptive CRF search (the UPWARD search of movie Quality, movie / series
# High and Base, an outlier episode's own CRF; downward searches always
# go one CRF at a time; not Custom): while a CRF is
# estimated more than this percentage of the video ceiling (150: above
# 1.5 x the ceiling), the next CRF sampled is CRF + 2 instead of CRF + 1
# (never above CRF_MAX). The skipped CRF + 1 is sampled as well when the
# CRF after it fits (the CRF chosen always has the CRF just below it
# sampled above the ceiling) and, for a series season, unless at least
# two sampled episodes (one in a batch of 1-2 episodes) are above the
# ceiling at the CRF after it by their own samples (outlier
# classification can change between CRFs; the estimates of episodes not
# sampled never count as proof). The CRF chosen is the same as
# with one-step-at-a-time sampling, with fewer sample rounds for titles
# far above the ceiling. Whole number, at least 100; 0 = always CRF + 1.
CRF_ADAPTIVE_STEP_THRESHOLD_PCT=150


# ============================================================
# AUDIO COMPRESSION POLICY  (audio_compress_menu.sh only)
#
# The only place audio is re-encoded. Movie / series compression never
# reads these settings.
# ============================================================

# High: offered only for tracks above this bitrate (kb/s).
AUDIO_HIGH_TRIGGER_KBPS=2000

# Compact: offered only for tracks of at least this size (GiB) ...
AUDIO_COMPACT_TRIGGER_GIB=1.0
# ... and the result is kept below this size (GiB).
AUDIO_COMPACT_LIMIT_GIB=0.95

# High target rates (kb/s), codec family of the source kept where possible.
AUDIO_HIGH_KBPS_1=128                 # mono
AUDIO_HIGH_KBPS_2=320                 # stereo
AUDIO_HIGH_KBPS_3TO4=640
AUDIO_HIGH_KBPS_5TO6=1024             # 5.1 (AC-3 is limited to 640 by the format)
AUDIO_HIGH_KBPS_7PLUS=1280

# Compact target rates (kb/s, Opus).
AUDIO_COMPACT_KBPS_1=96
AUDIO_COMPACT_KBPS_2=192
AUDIO_COMPACT_KBPS_3TO4=384
AUDIO_COMPACT_KBPS_5TO6=640
AUDIO_COMPACT_KBPS_7PLUS=768
