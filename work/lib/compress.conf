# ============================================================
# Compression policy  (~/compress/work/lib/compress.conf)
#
# Edit the values below to change movie / series / audio limits
# without touching the scripts. The file is read (bash syntax) by
# work/lib/policy.sh and validated whenever a menu starts; invalid
# values stop the menu with a message naming the setting.
#
# Units:  sizes in GiB, video bitrates in Mb/s, audio bitrates in kb/s.
# Numbers may be decimals ("2.5"). No negative values.
#
# Always applied, not configurable here:
#   - a video bitrate is never raised above the source video bitrate
#   - series audio already at/below its target rate is copied unchanged
# ============================================================


# ============================================================
# MOVIE COMPRESSION POLICY  (work/movie_compress.sh)
#
# *_VIDEO_GIB_PER_HOUR / *_VIDEO_*_GIB
#                 size of the main video stream only. Audio,
#                 subtitles, attachments and container overhead
#                 are not included. Never more than the source video.
# *_FLOOR_MBPS    minimum video bitrate; if the size target gives
#                 less, the menu asks: floor bitrate or size target
#                 (not asked when the source itself limits the target)
# *_MAX_MBPS      video bitrate ceiling; 0 = no bitrate ceiling,
#                 the size decides
# *_AUDIO_MAX_GIB all audio tracks together; above this the audio is
#                 re-encoded to AAC (rates below), otherwise copied.
#                 0 = never re-encode (always copy)
# ============================================================

# ---- Quality: video size from runtime, with a minimum size.
#   rate target  = runtime hours * MOVIE_QUALITY_VIDEO_GIB_PER_HOUR
#   video target = max(rate target, MOVIE_QUALITY_VIDEO_MIN_GIB),
#                  never more than the source video size
# The bitrate follows from that size and the runtime, capped at
# MOVIE_QUALITY_VIDEO_MAX_MBPS (0 = no cap). MIN_GIB is a minimum for
# short movies, not a maximum. If the result is below the floor, the
# menu asks: floor bitrate or size target.
MOVIE_QUALITY_VIDEO_GIB_PER_HOUR=8.4
MOVIE_QUALITY_VIDEO_MIN_GIB=20
MOVIE_QUALITY_VIDEO_FLOOR_MBPS=12
MOVIE_QUALITY_VIDEO_MAX_MBPS=0
MOVIE_QUALITY_AUDIO_MODE="copy"       # copy | cap
MOVIE_QUALITY_AUDIO_MAX_GIB=0         # used only with AUDIO_MODE="cap"
                                      # (re-encodes with the High AAC rates)

# ---- High: video size = runtime hours * GiB/hour (no minimum size),
# capped at the bitrate max.
MOVIE_HIGH_VIDEO_GIB_PER_HOUR=3.0
MOVIE_HIGH_VIDEO_FLOOR_MBPS=6
MOVIE_HIGH_VIDEO_MAX_MBPS=10
MOVIE_HIGH_AUDIO_MAX_GIB=2

# ---- Base: video size = runtime hours * GiB/hour (no minimum size),
# capped at the bitrate max.
MOVIE_BASE_VIDEO_GIB_PER_HOUR=1.25
MOVIE_BASE_VIDEO_FLOOR_MBPS=2.5
MOVIE_BASE_VIDEO_MAX_MBPS=5
# The menu asks for the audio limit; these are the offered choices
# (GiB, space separated, first = option 1).
MOVIE_BASE_AUDIO_MAX_GIB_CHOICES="1 0.5"

# ---- AAC rates (kb/s per track) used when movie audio is re-encoded.
# If the sum exceeds the audio limit, every track is scaled down
# proportionally, but never below MOVIE_AAC_MIN_KBPS.
MOVIE_HIGH_AAC_KBPS_7PLUS=768         # 7+ channels
MOVIE_HIGH_AAC_KBPS_6=640             # 5.1
MOVIE_HIGH_AAC_KBPS_3TO5=448
MOVIE_HIGH_AAC_KBPS_2=256
MOVIE_HIGH_AAC_KBPS_1=128

MOVIE_BASE_AAC_KBPS_7PLUS=512
MOVIE_BASE_AAC_KBPS_6=448
MOVIE_BASE_AAC_KBPS_3TO5=320
MOVIE_BASE_AAC_KBPS_2=192
MOVIE_BASE_AAC_KBPS_1=96

MOVIE_AAC_MIN_KBPS=64


# ============================================================
# SERIES COMPRESSION POLICY  (work/series_compress.sh)
#
# One fixed video + audio bitrate for every episode, derived from a
# total size per hour of runtime:
#   video kb/s = total kb/s * (100 - reserve) / 100 - audio kb/s
# Custom asks for GiB/hour and uses the High audio rates.
# ============================================================

SERIES_HIGH_TOTAL_GIB_PER_HOUR=4
SERIES_BASE_TOTAL_GIB_PER_HOUR=1.5

# Share of the total kept for container / subtitles / metadata (%).
SERIES_CONTAINER_RESERVE_PCT=1

# Refuse to start when audio leaves less than this for video (kb/s).
SERIES_MIN_VIDEO_KBPS=500

# ---- AAC rates (kb/s per track). A track whose source rate is already
# at or below its target is copied unchanged.
SERIES_HIGH_AAC_KBPS_7PLUS=768        # also used by Custom
SERIES_HIGH_AAC_KBPS_6=640
SERIES_HIGH_AAC_KBPS_3TO5=384
SERIES_HIGH_AAC_KBPS_2=192
SERIES_HIGH_AAC_KBPS_1=96

SERIES_BASE_AAC_KBPS_7PLUS=320
SERIES_BASE_AAC_KBPS_6=256
SERIES_BASE_AAC_KBPS_3TO5=192
SERIES_BASE_AAC_KBPS_2=128
SERIES_BASE_AAC_KBPS_1=64


# ============================================================
# AUDIO-ONLY COMPRESSION POLICY  (audio_compress_menu.sh)
# ============================================================

# High: offered only for tracks above this bitrate (kb/s).
AUDIO_HIGH_TRIGGER_KBPS=2000

# Compact: offered only for tracks of at least this size (GiB) ...
AUDIO_COMPACT_TRIGGER_GIB=1.0
# ... and the result is kept below this size (GiB).
AUDIO_COMPACT_LIMIT_GIB=0.95

# High target rates (kb/s), codec family of the source kept where possible.
AUDIO_HIGH_KBPS_1=128                 # mono
AUDIO_HIGH_KBPS_2=320                 # stereo
AUDIO_HIGH_KBPS_3TO4=640
AUDIO_HIGH_KBPS_5TO6=1024             # 5.1 (AC-3 is limited to 640 by the format)
AUDIO_HIGH_KBPS_7PLUS=1280

# Compact target rates (kb/s, Opus).
AUDIO_COMPACT_KBPS_1=96
AUDIO_COMPACT_KBPS_2=192
AUDIO_COMPACT_KBPS_3TO4=384
AUDIO_COMPACT_KBPS_5TO6=640
AUDIO_COMPACT_KBPS_7PLUS=768
